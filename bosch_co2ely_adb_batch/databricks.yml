# Databricks Asset Bundle definition for co_energystack_pipeline.
# CO₂ Electrolysis measurement data pipeline (XLSX/CSV → Parquet → Delta).
#
# Auth: cluster identity via run_as SP (sp-co2ely-energystack).
# SP has Storage Blob Data Contributor on stpsbdodxdev2datalake.
# Environment: auto-detected from workspace URL in Python code.
# No credentials in YAML or job parameters.
#
# Repo: CO-ESTACK-ADB/co_energystack_pipeline/
# See https://docs.databricks.com/dev-tools/bundles/index.html

bundle:
  name: co_energystack_pipeline

include:
  - resources/*.yml

# =============================================================================
# VARIABLES
# =============================================================================
variables:
  notification_recipients:
    description: List of DE emails for alerts
    type: complex
    default:
      - got4hc@bosch.com
  service_principal_id:
    lookup:
      service_principal: "sp-co2ely-energystack"
  static_job_cluster_policy_id:
    lookup:
      cluster_policy: "Advanced job cluster without autoscaling"
  scaled_job_cluster_policy_id:
    lookup:
      cluster_policy: "Advanced job cluster with autoscaling"
  artifact_location:
    description: Location of the deployed bundle artifacts
    default: /Shared/ELY/${bundle.name}
  integration_test_artifact_location:
    description: Location for integration test artifacts
    default: /Shared/ELY/${bundle.name}_integration_test

  # --- Shared cluster settings ---
  spark_version:
    description: Spark runtime version for all job clusters
    default: "15.4.x-scala2.12"
  scaled_node_type:
    description: Worker node type for autoscaled pipeline jobs
    default: "Standard_E16as_v4"
  scaled_driver_type:
    description: Driver node type for autoscaled pipeline jobs
    default: "Standard_D16as_v4"
  static_node_type:
    description: Node type for static single-node jobs (converter)
    default: "Standard_D16as_v4"

  # --- Per-layer task parameters ---
  bronze_task_params:
    description: Bronze Auto Loader task parameters
    type: complex
    default:
      - "--is_integration_test"
      - "{{job.parameters.is_integration_test}}"
      - "--env"
      - "${bundle.environment}"

# =============================================================================
# TARGETS 
# =============================================================================
targets:
  dev_user:
    mode: development
    default: true
    workspace:
      host: https://adb-1032635496032522.2.azuredatabricks.net
      root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}/

  dev_integration_test:
    mode: production
    workspace:
      host: https://adb-1032635496032522.2.azuredatabricks.net
      root_path: ${var.integration_test_artifact_location}
    run_as:
      service_principal_name: ${var.service_principal_id}

  dev:
    mode: production
    workspace:
      host: https://adb-1032635496032522.2.azuredatabricks.net
      root_path: ${var.artifact_location}
    run_as:
      service_principal_name: ${var.service_principal_id}

  qa:
    mode: production
    workspace:
      host: https://adb-7376334951991000.0.azuredatabricks.net
      root_path: ${var.artifact_location}
    run_as:
      service_principal_name: ${var.service_principal_id}

  qa_integration_test:
    mode: production
    workspace:
      host: https://adb-7376334951991000.0.azuredatabricks.net
      root_path: ${var.integration_test_artifact_location}
    run_as:
      service_principal_name: ${var.service_principal_id}

  prod:
    mode: production
    workspace:
      host: https://adb-5407587042408609.9.azuredatabricks.net
      root_path: ${var.artifact_location}
    run_as:
      service_principal_name: ${var.service_principal_id}

  prod_integration_test:
    mode: production
    workspace:
      host: https://adb-5407587042408609.9.azuredatabricks.net
      root_path: ${var.integration_test_artifact_location}
    run_as:
      service_principal_name: ${var.service_principal_id}
