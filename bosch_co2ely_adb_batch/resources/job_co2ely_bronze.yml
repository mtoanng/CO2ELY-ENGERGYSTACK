# =============================================================================
# REUSABLE COMPONENTS
# =============================================================================

# --- Base cluster config ---
_r2b_cluster_base: &r2b_cluster_base
  policy_id: ${var.static_job_cluster_policy_id}
  spark_version: ${var.spark_version}
  node_type_id: ${var.static_node_type}
  driver_node_type_id: ${var.static_node_type}
  num_workers: 0
  spark_conf:
    spark.master: "local[*]"
    spark.databricks.cluster.profile: singleNode
  azure_attributes:
    availability: "SPOT_WITH_FALLBACK_AZURE"
    first_on_demand: 1
    spot_bid_max_price: -1
  custom_tags:
    ResourceClass: SingleNode
    product_department_team: "ELY"
    project: "CO_energystack"

# --- Common job-level settings ---
_r2b_job_base: &r2b_job_base
  parameters:
    - name: "is_integration_test"
      default: "false"
    - name: "env"
      default: ${bundle.environment}
  permissions:
    - group_name: "idm2bcd_dssi03prod_co2elyd_data"
      level: "CAN_MANAGE"
  max_concurrent_runs: 1

# =============================================================================
# COMPOSED JOB SETTINGS
# =============================================================================

# Setting for dev/qa/prod
common_r2b_job_settings: &common_r2b_job_settings
  <<: *r2b_job_base
  email_notifications:
    on_failure: ${var.notification_recipients}
  notification_settings:
    no_alert_for_skipped_runs: true
  health:
    rules:
      - metric: "RUN_DURATION_SECONDS"
        op: "GREATER_THAN"
        value: 10800  # 3 hours
  job_clusters:
    - job_cluster_key: job_cluster
      new_cluster:
        <<: *r2b_cluster_base
        data_security_mode: SINGLE_USER

  # Bronze ingest: reads converter Parquet output → Delta tables.
  # Queries converter tracking table for SUCCESS records not yet ingested.
  # Auth: UC Managed Identity via FUSE mount (same as converter).
  tasks: &r2b_tasks
    - task_key: tsk_co2_ingest_parquet
      run_if: "ALL_SUCCESS"
      job_cluster_key: job_cluster
      spark_python_task:
        python_file: ../src/_1_r2b/ingest_parquet_to_bronze.py
        parameters:
          - "--is_integration_test"
          - "{{job.parameters.is_integration_test}}"
          - "--env"
          - "${bundle.environment}"
      timeout_seconds: 7200

# Setting for integration test
common_r2b_job_settings_int_test: &common_r2b_job_settings_int_test
  <<: *r2b_job_base
  job_clusters:
    - job_cluster_key: job_cluster
      new_cluster:
        <<: *r2b_cluster_base
        data_security_mode: USER_ISOLATION
  tasks: *r2b_tasks

# =============================================================================
# TARGETS
# =============================================================================
targets:
  dev_user:
    resources:
      jobs:
        job_co2ely_bronze:
          <<: *common_r2b_job_settings
          name: job_co2ely_bronze

        job_co2ely_int_test_bronze:
          <<: *common_r2b_job_settings_int_test
          name: job_co2ely_int_test_bronze

  dev:
    resources:
      jobs:
        job_co2ely_bronze:
          <<: *common_r2b_job_settings
          name: job_co2ely_bronze

  qa:
    resources:
      jobs:
        job_co2ely_bronze:
          <<: *common_r2b_job_settings
          name: job_co2ely_bronze

  prod:
    resources:
      jobs:
        job_co2ely_bronze:
          <<: *common_r2b_job_settings
          name: job_co2ely_bronze

  dev_integration_test:
    resources:
      jobs:
        job_co2ely_int_test_bronze:
          <<: *common_r2b_job_settings_int_test
          name: job_co2ely_int_test_bronze

  qa_integration_test:
    resources:
      jobs:
        job_co2ely_int_test_bronze:
          <<: *common_r2b_job_settings_int_test
          name: job_co2ely_int_test_bronze

  prod_integration_test:
    resources:
      jobs:
        job_co2ely_int_test_bronze:
          <<: *common_r2b_job_settings_int_test
          name: job_co2ely_int_test_bronze
