# Silver layer: conformed dimension tables (experiment identity + signal mapping).

common_silver_job_settings: &common_silver_job_settings
  parameters:
    - name: "is_integration_test"
      default: "false"
    - name: "env"
      default: ${bundle.environment}
  permissions:
    - group_name: "idm2bcd_dssi03prod_co2elyd_data"
      level: "CAN_MANAGE"
    - user_name: "nlu8hc@bosch.com"
      level: "CAN_MANAGE"
  max_concurrent_runs: 2
  job_clusters:
    - job_cluster_key: job_cluster
      new_cluster:
        policy_id: ${var.scaled_job_cluster_policy_id}
        spark_version: 15.4.x-scala2.12
        node_type_id: Standard_D16as_v4
        driver_node_type_id: Standard_D16as_v4
        data_security_mode: USER_ISOLATION
        autoscale:
          min_workers: 1
          max_workers: 2
        azure_attributes:
          availability: "SPOT_WITH_FALLBACK_AZURE"
          first_on_demand: 1
          spot_bid_max_price: -1
        custom_tags:
          product_department_team: "ELY"
          project: "CO_energystack"
  tasks:
    - task_key: tsk_dim_experiment
      run_if: "ALL_SUCCESS"
      job_cluster_key: job_cluster
      spark_python_task:
        python_file: ../src/_2_b2s/silver_dim_experiment.py
        parameters:
          - "--is_integration_test"
          - "{{job.parameters.is_integration_test}}"
          - "--env"
          - "${bundle.environment}"

    - task_key: tsk_dim_signal
      run_if: "ALL_SUCCESS"
      depends_on:
        - task_key: tsk_dim_experiment
      job_cluster_key: job_cluster
      spark_python_task:
        python_file: ../src/_2_b2s/silver_dim_signal.py
        parameters:
          - "--is_integration_test"
          - "{{job.parameters.is_integration_test}}"
          - "--env"
          - "${bundle.environment}"

targets:
  dev_user:
    resources:
      jobs:
        job_co2ely_silver:
          <<: *common_silver_job_settings
          name: job_co2ely_silver

        job_co2ely_int_test_silver:
          <<: *common_silver_job_settings
          name: job_co2ely_int_test_silver

  dev:
    resources:
      jobs:
        job_co2ely_silver:
          <<: *common_silver_job_settings
          name: job_co2ely_silver

  qa:
    resources:
      jobs:
        job_co2ely_silver:
          <<: *common_silver_job_settings
          name: job_co2ely_silver

  prod:
    resources:
      jobs:
        job_co2ely_silver:
          <<: *common_silver_job_settings
          name: job_co2ely_silver
          email_notifications:
            on_failure:
              - got4hc@bosch.com
            no_alert_for_skipped_runs: true

  dev_integration_test:
    resources:
      jobs:
        job_co2ely_int_test_silver:
          <<: *common_silver_job_settings
          name: job_co2ely_int_test_silver

  qa_integration_test:
    resources:
      jobs:
        job_co2ely_int_test_silver:
          <<: *common_silver_job_settings
          name: job_co2ely_int_test_silver

  prod_integration_test:
    resources:
      jobs:
        job_co2ely_int_test_silver:
          <<: *common_silver_job_settings
          name: job_co2ely_int_test_silver
