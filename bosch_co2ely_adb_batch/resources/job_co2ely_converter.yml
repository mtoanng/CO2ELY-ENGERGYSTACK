#       package: "polars>=1.0"
#   - pypi:
#       package: "azure-storage-blob>=12.19"
#   - pypi:
#       package: "azure-identity>=1.15"

# =============================================================================
# COMPOSED JOB SETTINGS
# =============================================================================

# Setting for dev (single-node)
common_converter_job_settings: &common_converter_job_settings
  <<: *converter_job_base
  email_notifications:
    on_failure: ${var.notification_recipients}
  notification_settings:
    no_alert_for_skipped_runs: true
  health:
    rules:
      - metric: "RUN_DURATION_SECONDS"
        op: "GREATER_THAN"
        value: 7200  # 2 hours
  job_clusters:
    - job_cluster_key: job_cluster
      new_cluster:
        <<: *converter_cluster_base
        data_security_mode: SINGLE_USER
  tasks: &converter_tasks
    - task_key: tsk_co2_convert_xlsx
      run_if: "ALL_SUCCESS"
      job_cluster_key: job_cluster
      spark_python_task:
        python_file: ../src/_0_convert/run_converter.py
        parameters:
          - "--is_integration_test"
          - "{{job.parameters.is_integration_test}}"
          - "--env"
          - "${bundle.environment}"
          - "--extensions"
          - ".xlsx,.xls"
      libraries: *converter_libs_xlsx
      timeout_seconds: 3600

    # - task_key: tsk_co2_convert_csv
    #   run_if: "ALL_SUCCESS"
    #   job_cluster_key: job_cluster
    #   spark_python_task:
    #     python_file: ../src/_0_convert/run_converter.py
    #     parameters:
    #       - "--is_integration_test"
    #       - "{{job.parameters.is_integration_test}}"
    #       - "--env"
    #       - "${bundle.environment}"
    #       - "--extensions"
    #       - ".csv"
    #   libraries: *converter_libs_csv
    #   timeout_seconds: 3600

# Setting for production (multi-worker, autoscale 1-4)
common_converter_job_settings_prod: &common_converter_job_settings_prod
  <<: *converter_job_base
  email_notifications:
    on_failure: ${var.notification_recipients}
  notification_settings:
    no_alert_for_skipped_runs: true
  health:
    rules:
      - metric: "RUN_DURATION_SECONDS"
        op: "GREATER_THAN"
        value: 7200
  job_clusters:
    - job_cluster_key: job_cluster
      new_cluster:
        <<: *converter_cluster_scaled
        data_security_mode: SINGLE_USER
  tasks: *converter_tasks

# Setting for integration test
common_converter_job_settings_int_test: &common_converter_job_settings_int_test
  <<: *converter_job_base
  job_clusters:
    - job_cluster_key: job_cluster
      new_cluster:
        <<: *converter_cluster_base
        data_security_mode: USER_ISOLATION
  tasks: *converter_tasks

# =============================================================================
# TARGETS
# =============================================================================
targets:
  dev_user:
    resources:
      jobs:
        job_co2ely_converter:
          <<: *common_converter_job_settings
          name: job_co2ely_converter

        job_co2ely_int_test_converter:
          <<: *common_converter_job_settings_int_test
          name: job_co2ely_int_test_converter

  dev:
    resources:
      jobs:
        job_co2ely_converter:
          <<: *common_converter_job_settings
          name: job_co2ely_converter

  qa:
    resources:
      jobs:
        job_co2ely_converter:
          <<: *common_converter_job_settings
          name: job_co2ely_converter

  prod:
    resources:
      jobs:
        job_co2ely_converter:
          <<: *common_converter_job_settings_prod
          name: job_co2ely_converter
          schedule:
            quartz_cron_expression: "0 0/30 * * * ?"
            timezone_id: "Europe/Berlin"
            pause_status: "UNPAUSED"

  dev_integration_test:
    resources:
      jobs:
        job_co2ely_int_test_converter:
          <<: *common_converter_job_settings_int_test
          name: job_co2ely_int_test_converter

  qa_integration_test:
    resources:
      jobs:
        job_co2ely_int_test_converter:
          <<: *common_converter_job_settings_int_test
          name: job_co2ely_int_test_converter

  prod_integration_test:
    resources:
      jobs:
        job_co2ely_int_test_converter:
          <<: *common_converter_job_settings_int_test
          name: job_co2ely_int_test_converter
