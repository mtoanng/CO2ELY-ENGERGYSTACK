# =============================================================================
# REUSABLE COMPONENTS
# =============================================================================

# --- Base cluster config (dev: single-node) ---
# Single-node mode for dev/integration testing.
_converter_cluster_base: &converter_cluster_base
  policy_id: ${var.static_job_cluster_policy_id}
  spark_version: ${var.spark_version}
  node_type_id: ${var.static_node_type}
  driver_node_type_id: ${var.static_node_type}
  num_workers: 0
  spark_conf:
    spark.master: "local[*]"
    spark.databricks.cluster.profile: singleNode
    spark.task.cpus: "4"
  spark_env_vars:
    AZURE_TENANT_ID: "0ae51e19-07c8-4e4b-bb6d-648ee58410f4"
    AZURE_CLIENT_ID: "57029129-abb0-4ec9-9b85-25fffb4af624"
    AZURE_CLIENT_SECRET: "{{secrets/kv-databricks-secret-scope-tbp/sp-co2ely-client-secret}}"
  azure_attributes:
    availability: "SPOT_WITH_FALLBACK_AZURE"
    first_on_demand: 1
    spot_bid_max_price: -1
  custom_tags:
    ResourceClass: SingleNode
    product_department_team: "ELY"
    project: "CO_energystack"

# --- Scaled cluster ---
# Autoscale: Spark scheduler adds workers as pending tasks grow.
_converter_cluster_scaled: &converter_cluster_scaled
  policy_id: ${var.scaled_job_cluster_policy_id}
  spark_version: ${var.spark_version}
  node_type_id: ${var.scaled_node_type}
  driver_node_type_id: ${var.scaled_driver_type}
  autoscale:
    min_workers: 1
    max_workers: 2
  spark_conf:
    spark.task.cpus: "4"
  spark_env_vars:
    AZURE_TENANT_ID: "0ae51e19-07c8-4e4b-bb6d-648ee58410f4"
    AZURE_CLIENT_ID: "57029129-abb0-4ec9-9b85-25fffb4af624"
    AZURE_CLIENT_SECRET: "{{secrets/kv-databricks-secret-scope-tbp/sp-co2ely-client-secret}}"
  azure_attributes:
    availability: "SPOT_WITH_FALLBACK_AZURE"
    first_on_demand: 1
    spot_bid_max_price: -1
  custom_tags:
    product_department_team: "ELY"
    project: "CO_energystack"

# --- Common job-level settings ---
_converter_job_base: &converter_job_base
  parameters:
    - name: "is_integration_test"
      default: "false"
    - name: "env"
      default: ${bundle.environment}
  permissions:
    - group_name: "idm2bcd_dssi03prod_co2elyd_data"
      level: "CAN_MANAGE"
  max_concurrent_runs: 1

# --- Shared library set ---
_converter_libs_xlsx: &converter_libs_xlsx
  - pypi:
      package: "polars[calamine]>=1.0"
  - pypi:
      package: "fastexcel"
  - pypi:
      package: "azure-storage-blob>=12.19"
  - pypi:
      package: "azure-identity>=1.15"

# _converter_libs_csv: &converter_libs_csv
