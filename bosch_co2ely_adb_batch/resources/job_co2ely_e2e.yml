# =============================================================================
# REUSABLE COMPONENTS
# =============================================================================

# --- Common job-level settings ---
_e2e_job_base: &e2e_job_base
  parameters:
    - name: "is_integration_test"
      default: "false"
    - name: "env"
      default: ${bundle.environment}
  permissions:
    - group_name: "idm2bcd_dssi03prod_co2elyd_data"
      level: "CAN_MANAGE"
  max_concurrent_runs: 1

# =============================================================================
# COMPOSED JOB SETTINGS
# =============================================================================

# Setting for dev/qa/prod
common_e2e_job_settings: &common_e2e_job_settings
  <<: *e2e_job_base
  email_notifications:
    on_failure: ${var.notification_recipients}
  notification_settings:
    no_alert_for_skipped_runs: true
  health:
    rules:
      - metric: "RUN_DURATION_SECONDS"
        op: "GREATER_THAN"
        value: 18000  # 5 hours

  tasks: &e2e_tasks
    - task_key: tsk_converter
      run_job_task:
        job_id: ${resources.jobs.job_co2ely_converter.id}
      timeout_seconds: 0

    - task_key: tsk_bronze
      run_job_task:
        job_id: ${resources.jobs.job_co2ely_bronze.id}
      timeout_seconds: 0
      depends_on:
        - task_key: tsk_converter
      run_if: ALL_SUCCESS

    - task_key: tsk_silver
      run_job_task:
        job_id: ${resources.jobs.job_co2ely_silver.id}
      timeout_seconds: 0
      depends_on:
        - task_key: tsk_bronze
      run_if: ALL_SUCCESS

    - task_key: tsk_gold
      run_job_task:
        job_id: ${resources.jobs.job_co2ely_gold.id}
      timeout_seconds: 0
      depends_on:
        - task_key: tsk_silver
      run_if: ALL_SUCCESS

    - task_key: tsk_serving
      run_job_task:
        job_id: ${resources.jobs.job_co2ely_serving.id}
      timeout_seconds: 0
      depends_on:
        - task_key: tsk_gold
      run_if: ALL_SUCCESS

# Setting for integration test
common_e2e_job_settings_int_test: &common_e2e_job_settings_int_test
  <<: *e2e_job_base
  tasks: *e2e_tasks

# =============================================================================
# TARGETS
# =============================================================================
targets:
  dev_user:
    resources:
      jobs:
        job_co2ely_e2e:
          <<: *common_e2e_job_settings
          name: job_co2ely_e2e

        job_co2ely_int_test_e2e:
          <<: *common_e2e_job_settings_int_test
          name: job_co2ely_int_test_e2e

  dev:
    resources:
      jobs:
        job_co2ely_e2e:
          <<: *common_e2e_job_settings
          name: job_co2ely_e2e

  qa:
    resources:
      jobs:
        job_co2ely_e2e:
          <<: *common_e2e_job_settings
          name: job_co2ely_e2e

  prod:
    resources:
      jobs:
        job_co2ely_e2e:
          <<: *common_e2e_job_settings
          name: job_co2ely_e2e
          schedule:
            quartz_cron_expression: "0 0 18 ? * MON-FRI"
            timezone_id: "Europe/Amsterdam"
            pause_status: "UNPAUSED"

  dev_integration_test:
    resources:
      jobs:
        job_co2ely_int_test_e2e:
          <<: *common_e2e_job_settings_int_test
          name: job_co2ely_int_test_e2e

  qa_integration_test:
    resources:
      jobs:
        job_co2ely_int_test_e2e:
          <<: *common_e2e_job_settings_int_test
          name: job_co2ely_int_test_e2e

  prod_integration_test:
    resources:
      jobs:
        job_co2ely_int_test_e2e:
          <<: *common_e2e_job_settings_int_test
          name: job_co2ely_int_test_e2e
