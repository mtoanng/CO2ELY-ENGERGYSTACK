# Gold layer: Dashboard-ready tables and summary statistics
# Consumed by the Dash reporting frontend.

common_gold_job_settings: &common_gold_job_settings
  parameters:
    - name: "is_integration_test"
      default: "false"
    - name: "env"
      default: ${bundle.environment}
  permissions:
    - group_name: "idm2bcd_dssi03prod_co2elyd_data"
      level: "CAN_MANAGE"
  max_concurrent_runs: 2
  job_clusters:
    - job_cluster_key: job_cluster
      new_cluster:
        policy_id: ${var.scaled_job_cluster_policy_id}
        spark_version: 15.4.x-scala2.12
        node_type_id: Standard_D16as_v4
        driver_node_type_id: Standard_D16as_v4
        autoscale:
          min_workers: 1
          max_workers: 4
        azure_attributes:
          availability: "SPOT_WITH_FALLBACK_AZURE"
          first_on_demand: 1
          spot_bid_max_price: -1
        custom_tags:
          product_department_team: "ELY"
          project: "CO_energystack"
  tasks:
    # tsk_co2_gold_summary (reads silver enriched) -- skipped for demo

    - task_key: tsk_co2_gold_timeseries
      job_cluster_key: "job_cluster"
      spark_python_task:
        python_file: ../src/_3_s2g/gold_timeseries_view.py
        parameters:
          - "--is_integration_test"
          - "{{job.parameters.is_integration_test}}"
          - "--env"
          - "${bundle.environment}"

targets:
  dev_user:
    resources:
      jobs:
        job_co2ely_gold:
          <<: *common_gold_job_settings
          name: job_co2ely_gold

        job_co2ely_int_test_gold:
          <<: *common_gold_job_settings
          name: job_co2ely_int_test_gold

  dev:
    resources:
      jobs:
        job_co2ely_gold:
          <<: *common_gold_job_settings
          name: job_co2ely_gold

  qa:
    resources:
      jobs:
        job_co2ely_gold:
          <<: *common_gold_job_settings
          name: job_co2ely_gold

  prod:
    resources:
      jobs:
        job_co2ely_gold:
          <<: *common_gold_job_settings
          name: job_co2ely_gold
          email_notifications:
            on_failure:
              - got4hc@bosch.com
            no_alert_for_skipped_runs: true

  dev_integration_test:
    resources:
      jobs:
        job_co2ely_int_test_gold:
          <<: *common_gold_job_settings
          name: job_co2ely_int_test_gold

  qa_integration_test:
    resources:
      jobs:
        job_co2ely_int_test_gold:
          <<: *common_gold_job_settings
          name: job_co2ely_int_test_gold

  prod_integration_test:
    resources:
      jobs:
        job_co2ely_int_test_gold:
          <<: *common_gold_job_settings
          name: job_co2ely_int_test_gold
