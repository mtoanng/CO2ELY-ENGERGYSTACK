# =============================================================================
# REUSABLE COMPONENTS (same pattern as TBP job_ely_bronze.yml)
# =============================================================================

# --- Base cluster config ---
# Single-node for dev (Polars on driver via local[*]).
# Scale to multi-worker for production — Spark distributes files to executors,
# each runs Polars natively via UC Volume FUSE (zero JVM overhead).
_converter_cluster_base: &converter_cluster_base
  policy_id: ${var.static_job_cluster_policy_id}
  spark_version: ${var.spark_version}
  node_type_id: ${var.static_node_type}
  driver_node_type_id: ${var.static_node_type}
  num_workers: 0
  spark_conf:
    spark.master: "local[*]"
    spark.databricks.cluster.profile: singleNode
  azure_attributes:
    availability: "SPOT_WITH_FALLBACK_AZURE"
    first_on_demand: 1
    spot_bid_max_price: -1
  custom_tags:
    ResourceClass: SingleNode
    product_department_team: "ELY"
    project: "CO_energystack"

# --- Common job-level settings (same as TBP) ---
_converter_job_base: &converter_job_base
  parameters:
    - name: "is_integration_test"
      default: "false"
    - name: "env"
      default: ${bundle.environment}
  permissions:
    - group_name: "idm2bcd_dssi03prod_pemely_data"
      level: "CAN_MANAGE"
  max_concurrent_runs: 1

# =============================================================================
# COMPOSED JOB SETTINGS
# =============================================================================

# Setting for dev/qa/prod
common_converter_job_settings: &common_converter_job_settings
  <<: *converter_job_base
  email_notifications:
    on_failure: ${var.notification_recipients}
  notification_settings:
    no_alert_for_skipped_runs: true
  health:
    rules:
      - metric: "RUN_DURATION_SECONDS"
        op: "GREATER_THAN"
        value: 7200  # 2 hours
  job_clusters:
    - job_cluster_key: job_cluster
      new_cluster:
        <<: *converter_cluster_base
        data_security_mode: SINGLE_USER

  # Tasks run in PARALLEL (no depends_on between xlsx and csv).
  # Auth: UC Managed Identity via FUSE mount. Zero credentials.
  # I/O: Polars reads/writes directly to /Volumes/... (no JVM).
  # Distribution: Spark mapPartitions (linear scaling with num_workers).
  tasks: &converter_tasks
    - task_key: tsk_co2_convert_xlsx
      run_if: "ALL_SUCCESS"
      job_cluster_key: job_cluster
      spark_python_task:
        python_file: ../src/_0_convert/run_converter.py
        parameters:
          - "--is_integration_test"
          - "{{job.parameters.is_integration_test}}"
          - "--env"
          - "${bundle.environment}"
          - "--extensions"
          - ".xlsx,.xls"
      libraries:
        - pypi:
            package: "polars[calamine]>=1.0"
        - pypi:
            package: "fastexcel"
      timeout_seconds: 3600

    - task_key: tsk_co2_convert_csv
      run_if: "ALL_SUCCESS"
      job_cluster_key: job_cluster
      spark_python_task:
        python_file: ../src/_0_convert/run_converter.py
        parameters:
          - "--is_integration_test"
          - "{{job.parameters.is_integration_test}}"
          - "--env"
          - "${bundle.environment}"
          - "--extensions"
          - ".csv"
      libraries:
        - pypi:
            package: "polars>=1.0"
      timeout_seconds: 3600

# Setting for integration test
common_converter_job_settings_int_test: &common_converter_job_settings_int_test
  <<: *converter_job_base
  job_clusters:
    - job_cluster_key: job_cluster
      new_cluster:
        <<: *converter_cluster_base
        data_security_mode: USER_ISOLATION
  tasks: *converter_tasks

# =============================================================================
# TARGETS
# =============================================================================
targets:
  dev_user:
    resources:
      jobs:
        job_co2_converter:
          <<: *common_converter_job_settings
          name: job_co2_converter

        job_co2_int_test_converter:
          <<: *common_converter_job_settings_int_test
          name: job_co2_int_test_converter

  dev:
    resources:
      jobs:
        job_co2_converter:
          <<: *common_converter_job_settings
          name: job_co2_converter

  qa:
    resources:
      jobs:
        job_co2_converter:
          <<: *common_converter_job_settings
          name: job_co2_converter

  prod:
    resources:
      jobs:
        job_co2_converter:
          <<: *common_converter_job_settings
          name: job_co2_converter
          schedule:
            quartz_cron_expression: "0 0/30 * * * ?"
            timezone_id: "Europe/Berlin"
            pause_status: "UNPAUSED"

  dev_integration_test:
    resources:
      jobs:
        job_co2_int_test_converter:
          <<: *common_converter_job_settings_int_test
          name: job_co2_int_test_converter

  qa_integration_test:
    resources:
      jobs:
        job_co2_int_test_converter:
          <<: *common_converter_job_settings_int_test
          name: job_co2_int_test_converter

  prod_integration_test:
    resources:
      jobs:
        job_co2_int_test_converter:
          <<: *common_converter_job_settings_int_test
          name: job_co2_int_test_converter
